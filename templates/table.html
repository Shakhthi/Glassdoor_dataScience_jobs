<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 2rem; }
        .table-container { overflow-x: auto; }
        .actions { margin-bottom: 1rem; }
    </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-12">
        <nav class="navbar navbar-light bg-light rounded mb-3">
          <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Prediction Results</span>
            <div>
              <a class="btn btn-sm btn-outline-primary" href="/docs">API Docs</a>
              <a class="btn btn-sm btn-outline-secondary" href="/">Home</a>
            </div>
          </div>
        </nav>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body d-flex flex-wrap align-items-center gap-2">
            <div class="me-3">
              <form method="get" action="/predict">
                <button class="btn btn-sm btn-success" type="submit">Upload another CSV</button>
              </form>
            </div>
            <div>
              <a class="btn btn-sm btn-outline-info" href="/prediction_output/output.csv" download>Download CSV</a>
            </div>
            <div class="ms-auto text-end">
              <small class="text-muted">Rows: <span id="rowCount">-</span></small>
              <span class="mx-2">|</span>
              <small class="text-muted">Cols: <span id="colCount">-</span></small>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4 d-flex justify-content-end align-items-center">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="toggleIndex" checked>
          <label class="form-check-label small" for="toggleIndex">Show index</label>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12 table-container">
        <!-- The `table` variable is an HTML string generated by pandas.DataFrame.to_html() -->
        {{ table | safe }}
      </div>
    </div>

    <footer class="row mt-4">
      <div class="col-12 text-muted small">Rendered by the DS Jobs prediction service.</div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery + DataTables for searchable, paginated table -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    $(document).ready(function() {
      // Initialize DataTable on the first table found in the injected HTML
      var $tbl = $('table').first();
      if ($tbl.length) {
        // ensure Bootstrap table classes are present for visual consistency
        $tbl.addClass('table table-striped table-hover table-sm');
        // DataTable init
        var dt = $tbl.DataTable({
          paging: true,
          pageLength: 10,
          lengthMenu: [10, 25, 50, 100],
          ordering: true,
          info: true,
          searching: true,
          responsive: true,
          // preserve existing classes
          createdRow: function(row, data, dataIndex) { }
        });

        // Update counters
        $('#rowCount').text(dt.rows().count());
        $('#colCount').text(dt.columns().count());

        // Index toggle: hide/show first column if it appears to be an index (non-header label)
        $('#toggleIndex').on('change', function(){
          var colIndex = 0; // pandas index is usually first column
          var col = dt.column(colIndex);
          if (col) {
            col.visible(this.checked);
          }
        });
      }
    });
  </script>
</body>
</html>
